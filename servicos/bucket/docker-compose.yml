services:
  minio:
    # A imagem oficial minio/minio foi removida do Docker Hub; a bitnamilegacy é compatível com o SDK do MinIO
    image: bitnamilegacy/minio:latest
    container_name: minio
    ports:
      - "9100:9000"
      - "9002:9001"
    volumes:
      - ./docs:/bitnami/minio/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: ecommerce.produtos,ecommerce.loja

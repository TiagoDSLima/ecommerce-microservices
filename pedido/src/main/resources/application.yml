server:
  port: 8085

spring:
  application:
    name: pedido
  datasource:
    url: jdbc:postgresql://localhost:5556/ecommercepedido
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

ecommerce:
  config:
    kafka:
      server-url: 'http://localhost:29092'
      topics:
        produtos-vendidos: 'produtos-vendidos'
    clients:
      produto:
        url: 'http://localhost:8083/produto'
      participante:
        url: 'http://localhost:8082/participante'
      loja:
        url: 'http://localhost:8084/loja'
      auth:
        url: 'http://localhost:8081/auth'
    service-client:
      id: 'pedido'
      secret: ${PEDIDO_CLIENT_SECRET:dev-pedido-secret}

auth:
  secret-key: ${JWT_SECRET:dev-secret-key-12345678901234567890}
